name: Unified Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-creator-release.yml"
      - "installer/windows/**"
      - "obs-plugin/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-creator-release.yml"
      - "installer/windows/**"
      - "obs-plugin/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build and verify one-click installer
    runs-on: windows-2022
    steps:
      - name: Check out Creator Assistant
        uses: actions/checkout@v7
        with:
          path: product

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install and verify desktop helper
        shell: pwsh
        run: |
          corepack enable
          Set-Location product
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run audit
          pnpm run build
          pnpm prune --prod

      - name: Check out official OBS plugin template
        uses: actions/checkout@v7
        with:
          repository: obsproject/obs-plugintemplate
          ref: 3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc
          path: template

      - name: Prepare native OBS plugin build
        shell: pwsh
        run: |
          Copy-Item product/obs-plugin/CMakeLists.txt template/CMakeLists.txt -Force
          Copy-Item product/obs-plugin/buildspec.json template/buildspec.json -Force
          Remove-Item template/src/plugin-main.c -Force
          Remove-Item template/data -Recurse -Force
          Copy-Item product/obs-plugin/src/* template/src -Recurse -Force
          Copy-Item product/obs-plugin/data template/data -Recurse -Force
          $presets = Get-Content template/CMakePresets.json -Raw
          $presets = $presets.Replace('"ENABLE_FRONTEND_API": false', '"ENABLE_FRONTEND_API": true')
          $presets = $presets.Replace('"ENABLE_QT": false', '"ENABLE_QT": true')
          Set-Content template/CMakePresets.json $presets

      - name: Build native OBS plugin
        shell: pwsh
        working-directory: template
        env:
          CI: "true"
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Build transparent desktop companion launcher
        shell: pwsh
        run: |
          cmake -S product/installer/windows/launcher -B launcher-build -A x64
          if ($LASTEXITCODE -ne 0) { throw "Launcher configuration failed with exit code $LASTEXITCODE." }
          cmake --build launcher-build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed with exit code $LASTEXITCODE." }

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $nodeVersion = node --version
          $zipName = "node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$nodeVersion/$zipName" -OutFile node-runtime.zip
          Expand-Archive -Path node-runtime.zip -DestinationPath node-runtime
          $runtimeDir = Get-ChildItem node-runtime -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path release-payload/helper/runtime -Force | Out-Null
          Copy-Item "$($runtimeDir.FullName)/node.exe" release-payload/helper/runtime/node.exe

      - name: Assemble unified installer payload
        shell: pwsh
        env:
          CHATGPT_PLUGIN_URL: ${{ vars.CHATGPT_PLUGIN_URL }}
        run: |
          New-Item -ItemType Directory -Path release-payload/helper -Force | Out-Null
          New-Item -ItemType Directory -Path release-payload/plugin -Force | Out-Null
          Copy-Item product/dist release-payload/helper/dist -Recurse
          Copy-Item product/node_modules release-payload/helper/node_modules -Recurse
          Copy-Item product/package.json release-payload/helper/package.json
          Copy-Item product/.env.example release-payload/helper/.env.example
          Copy-Item 'launcher-build/Release/OBS-Creator-Assistant.exe' release-payload/helper/OBS-Creator-Assistant.exe
          if ($env:CHATGPT_PLUGIN_URL) {
            (Get-Content release-payload/helper/.env.example -Raw).Replace('CHATGPT_PLUGIN_URL=', "CHATGPT_PLUGIN_URL=$env:CHATGPT_PLUGIN_URL") |
              Set-Content release-payload/helper/.env.example -Encoding UTF8
          }
          $pluginDll = Get-ChildItem template/release/RelWithDebInfo -Filter obs-creator-assistant.dll -File -Recurse | Select-Object -First 1
          if (-not $pluginDll) { throw 'Native plugin DLL was not produced.' }
          Copy-Item $pluginDll.FullName release-payload/plugin/obs-creator-assistant.dll
          Copy-Item product/obs-plugin/data/locale/en-US.ini release-payload/plugin/en-US.ini
          Copy-Item product/obs-plugin/data/manifest.json release-payload/plugin/manifest.json

      - name: Validate payload
        shell: pwsh
        run: |
          $required = @(
            'release-payload/helper/runtime/node.exe',
            'release-payload/helper/dist/bootstrap.js',
            'release-payload/helper/OBS-Creator-Assistant.exe',
            'release-payload/plugin/obs-creator-assistant.dll',
            'release-payload/plugin/manifest.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing installer payload: $path" }
          }
          $nodeSignature = Get-AuthenticodeSignature -LiteralPath 'release-payload/helper/runtime/node.exe'
          if ($nodeSignature.Status -ne 'Valid') {
            throw "The upstream Node.js runtime signature is invalid: $($nodeSignature.StatusMessage)"
          }
          $forbidden = Get-ChildItem release-payload -Recurse -File | Where-Object Extension -In '.ps1', '.vbs', '.cmd', '.bat'
          if ($forbidden) { throw "Script-based launchers are not permitted in the release payload: $($forbidden.FullName -join ', ')" }

      - name: Build one-click installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) {
            $candidate = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (Test-Path -LiteralPath $candidate) { $iscc = $candidate }
          }
          if (-not $iscc) { throw 'Inno Setup compiler is not installed on the Windows runner.' }
          $version = (Get-Content product/package.json -Raw | ConvertFrom-Json).version
          $payload = (Resolve-Path release-payload).Path
          $output = Join-Path $PWD 'release-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & $iscc "/DPayloadRoot=$payload" "/DOutputDir=$output" "/DAppVersion=$version" 'product/installer/windows/OBS-Creator-Assistant.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          $installer = Join-Path $output 'OBS-Creator-Assistant-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Installer executable was not produced.' }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  OBS-Creator-Assistant-Setup.exe" } |
            Set-Content release-output/OBS-Creator-Assistant-Setup.exe.sha256 -Encoding ASCII

      - name: Upload private unsigned artifact for SignPath review
        uses: actions/upload-artifact@v7
        with:
          name: OBS-Creator-Assistant-SignPath-input
          path: |
            release-output/OBS-Creator-Assistant-Setup.exe
            release-output/OBS-Creator-Assistant-Setup.exe.sha256
          if-no-files-found: error

