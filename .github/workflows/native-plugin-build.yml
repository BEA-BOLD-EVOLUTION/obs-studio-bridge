name: Native OBS Plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "obs-plugin/**"
      - ".github/workflows/native-plugin-build.yml"
  push:
    branches: [main]
    paths:
      - "obs-plugin/**"
      - ".github/workflows/native-plugin-build.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Check out Creator Assistant
        uses: actions/checkout@v4
        with:
          path: product

      - name: Check out official OBS plugin template
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: 3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc
          path: template

      - name: Prepare plugin build
        shell: pwsh
        run: |
          Copy-Item product/obs-plugin/CMakeLists.txt template/CMakeLists.txt -Force
          Copy-Item product/obs-plugin/buildspec.json template/buildspec.json -Force
          Remove-Item template/src -Recurse -Force
          Remove-Item template/data -Recurse -Force
          Copy-Item product/obs-plugin/src template/src -Recurse -Force
          Copy-Item product/obs-plugin/data template/data -Recurse -Force
          $presets = Get-Content template/CMakePresets.json -Raw
          $presets = $presets.Replace('"ENABLE_FRONTEND_API": false', '"ENABLE_FRONTEND_API": true')
          $presets = $presets.Replace('"ENABLE_QT": false', '"ENABLE_QT": true')
          Set-Content template/CMakePresets.json $presets

      - name: Build native plugin
        shell: pwsh
        working-directory: template
        env:
          CI: "true"
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Add one-click installer
        shell: pwsh
        run: |
          Copy-Item product/obs-plugin/installer/Setup.cmd template/release/RelWithDebInfo/Setup.cmd -Force
          Copy-Item product/obs-plugin/installer/Install-OBS-Creator-Assistant.ps1 template/release/RelWithDebInfo/Install-OBS-Creator-Assistant.ps1 -Force

      - name: Upload native plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-creator-assistant-windows-x64
          path: template/release/RelWithDebInfo/**
          if-no-files-found: error
